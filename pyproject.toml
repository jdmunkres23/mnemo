[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-conversation-viewer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastembed",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "nbstripout",
]

[tool.setuptools]
packages = []

